# --- Attract-demo deep-run interior labels (reviewed 2026-09-30) ---------------
#
# Source: logs/routes/attract-strip-coverage.json, produced by the no-input
# attract route driven to ~19,000 frames over TCP -- the deepest run this repo
# has done into the game's own demo. The 13,500-frame attract run was clean
# after the G7 merge; going further reaches four more dispatch misses:
#
#   0x0802A258  0x0802A26E  -> interior labels of the function at 0x0802A1AE
#                              (gaps 0xAA / 0xC0, bridged 1x)
#   0x0802A656  0x0802A680  -> interior labels of the function at 0x0802A5DC
#                              (gaps 0x7A / 0xA4, bridged 20x / 11x)
#
# tools/validation/classify_misses.py --detail classifies all four as
# `interior-label`, not `new-region`: the enclosing function is already in the
# dispatch table, so these are mid-function entry points reached by a computed
# transfer -- the same shape as the cluster-A/G labels merged at Checkpoint 6.
# They are NOT the dynamic stack-stub family (those are 0x03007Dxx in IWRAM and
# are deliberately never declared, see docs/KNOWN_ISSUES.md F6).
#
# Verification is the usual one: regenerate, rebuild, re-run the replay routes,
# require byte-identical frames and a lower miss count. Addresses stay
# address-only; no semantic names are invented for unreversed code.

