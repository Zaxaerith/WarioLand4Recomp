# ---------------------------------------------------------------------------
# Wario Land 4 (GBA, USA/EU "AWAE") — gbarecomp game configuration.
#
# This single file serves BOTH sides of the pipeline (documented in the
# framework's docs/TOML_SCHEMA.md):
#   * the recompiler (`gba_recompile --config game.toml`)  -> [program],
#     [identity], [[extra_func]], [[resume_range]], [[jump_table]],
#     [[code_copy]], [[data_range]]
#   * the runtime (`--config game.toml`)                  -> [rom], [bios],
#     [save], [video], [audio], [runtime]
#
# Provenance: every identity value below was measured from the verified local
# ROM and recorded in docs/ROM_IDENTITY.json. Nothing here is guessed.
#
# HUMAN-REVIEWED ONLY: never auto-merge recomp_master_misses_*.toml.frag
# proposals into this file (framework PRINCIPLES.md "Never auto-write
# game.toml").
# ---------------------------------------------------------------------------

[game]
name = "Wario Land 4"
short_name = "wario_land_4"

[program]
name = "Wario Land 4"
id = "AWAE"
load_address = 0x08000000
size = 0x00800000          # 8 MiB, 0xFF padded (verified)
entry_pc = 0x08000000      # cartridge reset vector; its ARM branch (0xEA00002E)
                           # targets 0x080000C0 (verified from ROM bytes 0..3)
codegen_shards = 8         # adaptive run produced 4; pin an explicit shard count
static_resume_all = true   # resume every statically recoverable mid-function entry

[identity]
sha1 = "b9fe05a8080e124b67bce6a623234ee3b518a2c1"
md5 = "5fe47355a33e3fabec2a1607af88a404"

[rom]
path = "Wario Land 4 (USA, Europe).gba"
sha1 = "b9fe05a8080e124b67bce6a623234ee3b518a2c1"

[bios]
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# LLE (the default) executes the recompiled BIOS through the dispatch table.
# hle/skip_intro stay off so the bring-up measures the real system path.
hle = false
skip_intro = false

[save]
# The cartridge save hardware is proven by ROM signature, not by filename:
# file offset 0x283EF8 holds ASCII "SRAM_V112" and the decompiled save code
# programs the 0x0E000000 SRAM window (see docs/ROM_IDENTITY.json
# save_hardware). 32768 is exactly the SRAM size the shared runtime accepts.
type = "sram"
size = 32768
path = "saves/wario_land_4_awae.sav"

[runtime]
window_title = "WarioLand4Recomp"

[video]
screen = "raw"
view_width = 240
resize_view = false

[audio]
shadow = false

# ---------------------------------------------------------------------------
# Discovery metadata (recompiler side). Derived from the verified cartridge
# image and reviewed by hand — never auto-merged from a miss-proposal file.
# ---------------------------------------------------------------------------

# 36-entry abs32 interworking switch table. Evidence, all from the ROM:
#   * slots 0x0809540C..0x08095498 hold 36 consecutive in-image pointers
#     (0x080014D0, 0x08001540, ... , 0x080014B0, 0x08001498); the word at
#     0x0809549C is non-pointer data, so the table ends exactly there.
#   * the literal pool at 0x08001530 holds this exact base, and the loop at
#     0x08001500-0x08001512 copies `mov r1, #0x24` = 36 words from it — the
#     dispatcher's own count, not a guess.
#   * entries 34/35 are 0x080014B0 and 0x08001498, and the remaining entries
#     are the 0x080015CC-0x08001686 cluster: every one of them was reported by
#     the runtime as a dispatch miss before this table was declared.
# The finder's auto-detector does not recognize this dispatcher, so the table
# is declared here (see docs/KNOWN_ISSUES.md F5).
[[jump_table]]
addr = 0x0809540C
stride = 4
count = 36
format = "abs32"
entries_mode = "auto"
note = "Switch/copy table of 36 thumb pointers; entries carry the interworking bit"

# ---------------------------------------------------------------------------
# Code the cartridge copies into IWRAM at runtime.
#
# Both spans below were verified byte for byte against a 32 KiB IWRAM dump
# (tools/validation/verify_code_copy.py), and both boundary checks are exact:
# the word just before the destination and the byte just past the span differ
# on the two sides, so neither span is an artefact of matching zero-filled RAM.
# Names stay address-based: this is a work-in-progress decomp and the semantic
# role is recorded in the note, never guessed into a symbol name.
# ---------------------------------------------------------------------------

# 0x03000C44 is the ARM user-IRQ handler. The cartridge installs it itself:
# ROM 0x080009E0-0x080009F4 loads the literal triple
#   0x040000D4 (REG_DMA3SAD), 0x080000FC (source), 0x03000C44 (destination)
# and writes 0x80000400 to DMA3CNT (enable, 16-bit units, 0x400 halfwords =
# 0x800 bytes), then stores 0x03000C44 into the user IRQ vector 0x03007FFC.
# The IWRAM span is byte-identical to ROM 0x080000FC..0x080008FB (1667/2048
# nonzero, sha256 eb78550311e3e32c66e58cd2ab24821e984aee0cac5e96b1491b43a1a8c78659),
# which is exactly the 0x800 bytes that DMA count describes.
[[code_copy]]
runtime_start = 0x03000C44
source_start = 0x080000FC
size = 0x800
name = "iwram_03000C44"
note = "DMA3-copied ARM handler; also installed as the user IRQ vector at 0x03007FFC"

# 0x03004B28 runs in Thumb mode and is byte-identical to ROM
# 0x080010F4..0x080014F3 (927/1024 nonzero, sha256
# 7b4fef2cb8e0e87ce8e8aaf244970f121851095a6d6260a423eda20791d5b238).
# Size is 0x400, not 0x401: the byte at +0x400 is 0x00 on both sides (the
# copied tail and the ROM word 0x080014F4 both start with 0x00), which is a
# zero coincidence, and the spans diverge at +0x401. The copying instruction
# itself was NOT located: the CPU mem-write watchpoint fires first on an
# earlier BIOS clear of the same region, and DMA transfers bypass the CPU
# write-trace path, so the byte-exact boundary is the evidence relied on here.
[[code_copy]]
runtime_start = 0x03004B28
source_start = 0x080010F4
size = 0x400
name = "iwram_03004B28"
note = "Thumb code copied into IWRAM; source range is also executed in place from ROM"

# The runtime side needs an explicit entry for each copied routine as well:
# the dispatch table is keyed by the address the CPU actually jumps to, and the
# auto-walk cannot see a jump through a IWRAM pointer. `mode` matches what the
# runtime reported for each miss (0x03000C44 arm, 0x03004B28 thumb).
[[extra_func]]
addr = 0x03000C44
mode = "arm"
note = "Entry of the DMA-copied IRQ handler; reached through the 0x03007FFC vector"

[[extra_func]]
addr = 0x03004B28
mode = "thumb"
note = "Entry of the Thumb routine copied to IWRAM; reached through a RAM pointer"

# The hottest cartridge miss (273 bridges in a 900-frame run) is an ordinary
# ROM function the auto-walk never reached, so nothing calls it statically:
# it is entered from the IRQ path. ROM 0x08000BE8 starts with `push {lr}`, then
# loads 0x030019FC, compares, and `beq 0x08000BF6`; 0x08000BF6 is a label inside
# that function (it acknowledges REG_IF bit 0 at 0x04000202 and writes to
# 0x03000C42), so 0x08000BE8 - not 0x08000BF6 - is the function entry.
[[extra_func]]
addr = 0x08000BE8
mode = "thumb"
note = "Undiscovered IRQ-path function; 0x08000BF6 is an internal branch label"

# ---------------------------------------------------------------------------
# The high-IWRAM area (0x03007D18-0x03007D9F) is NOT a code copy. NOTHING here
# is declared, on purpose, and this note is the evidence for that decision.
#
# Four spans in this area were once declared (0x03007D18, 0x03007D48,
# 0x03007D70, 0x03007D90), each byte-exact against a ROM range in a 32 KiB
# IWRAM dump. Every one of them had to be removed: with them declared, a
# 900-frame run never finished, and the trace showed the guest jumping to the
# unmapped pc=0xD00C2A00.
#
# Root cause, from GBARECOMP_TRACE_ON_DISPATCH_MISS=1 (see
# logs/routes/p-trace.err): this area is the STACK, and the cartridge writes
# little code stubs onto it and executes them. The trace shows the copy loop
# itself at ROM 0x0800335C-0x0800336C (`ldrh r0,[r3]; strh r0,[r2]; add r3,#2;
# add r2,#2; sub/cmp/bne`, r2 = destination, r3 = source, r1 = count):
#     mem_w pc=0x0800335E addr=0x03007D44 value=0x0000BC30   (pop {r4,r5})
#     mem_w pc=0x0800335E addr=0x03007D46 value=0x0000BC02   (pop {r1})
#     mem_w pc=0x0800335E addr=0x03007D48 value=0x00004708   (bx r1)
# and the entry into the stub, one event later:
#     exchange pc=0x03007D1C  sp=0x03007D1C  r3=0x03007D1D   (r3 = sp|1)
# i.e. the ROM caller does `mov r3, sp; add r3, #1`, fills a return stub just
# above its own frame and jumps to it (r3 = sp|1 IS the "code pointer").
#
# Consequences, both verified:
#   * the byte match that looked like a copy is a match against STACK CONTENT,
#     and the destination differs from run to run (0x03007D44 in this trace,
#     0x03007D40 in the dump the spans were derived from). A runtime address
#     that varies cannot be described by [[code_copy]], whose contract is a
#     fixed RAM address mirroring fixed ROM bytes.
#   * declaring it makes the recompiler emit a STATIC function for that RAM
#     range, and the runtime then dispatches into it at an interior resume
#     offset (0x03007D1C) instead of running the bytes the cartridge just
#     wrote. The prologue is skipped, so the stub's own `pop`/`bx` consumes a
#     frame that was never pushed and returns to garbage.
# With the declarations removed, the runtime bridges these PCs through the
# interpreter and executes the ACTUAL generated bytes with the right frame.
# That is why the remaining dispatch misses in a 900-frame run are these very
# addresses: they are dynamic RAM code, legitimately not statically coverable.
# The watchpoint note that used to be here ("the writer is a DMA that bypasses
# the write trace") was WRONG: the writer is visible above; the watchpoint had
# merely stopped on the earlier BIOS zero-fill of the same address first.
# See docs/KNOWN_ISSUES.md F6 for the general lesson.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Gameplay-path discovery gaps (reviewed merge of the runtime's own proposal).
#
# Source: logs/routes/game-13500-misses.toml.frag, written by the runtime during
# tests/input/gameplay-idle.keyinput.txt at 13,500 frames. That file proposes 75
# [[extra_func]] entries. Reviewed with tools/validation/classify_misses.py:
#
#   * 13 entries are REJECTED: every 0x03007Dxx PC in the proposal is the
#     dynamic stack-stub family already explained above (F6/G6). The framework's
#     own comment calls that run a "JUMP-TABLE CANDIDATE"; it is a false
#     positive, and declaring those addresses is what caused the 0xD00C2A00
#     wild jump. They stay interpreted, on purpose.
#   * the remaining 62 are cartridge ROM addresses executed in Thumb mode that
#     the static walk never reached, because nothing references them statically:
#     the nearest preceding dispatch entry is 0x1DA-0x4284 bytes away (the
#     classify_misses.py table for checkpoint 6 recorded this before the
#     round-by-round log was retired).
#     They are real instruction boundaries (the CPU dispatched to them), so each
#     becomes a function entry here.
#
# Every entry is address-only: this is a work-in-progress decomp and no semantic
# name is invented. Test before/after is byte-identical final frames on
# ctrl-idle / ctrl-right / game-13500, plus a drop in distinct_misses.
# ---------------------------------------------------------------------------

